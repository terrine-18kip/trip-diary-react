services:
  app:
    build: ./app
    container_name: trip_diary_app
    volumes:
      - ../backend:/var/www/html
      - /var/www/html/vendor
    ports:
      - "80:80"

  front:
    build: ./front
    container_name: trip_diary_front
    volumes:
      - ../frontend:/usr/src/app:cached
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"

  db:
    image: mysql:8.0
    container_name: trip_diary_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trip_diary_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      TZ: 'Asia/Tokyo'
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
    volumes:
     - ./db/data:/var/lib/mysql
     - ./db/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - 3306:3306

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5
    container_name: trip_diary_phpmyadmin
    links:
      - db
    ports:
      - 8080:80
    volumes:
      - ./phpmyadmin/sessions:/sessions